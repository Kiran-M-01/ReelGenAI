<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:#fff;
    background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
    position:relative;
    overflow:hidden;
  }
  body::before,body::after{
    content:"";
    position:absolute;
    width:480px;height:480px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.55;
    z-index:0;
  }
  body::before{background:#6366f1;top:-160px;left:-160px}
  body::after{background:#a855f7;bottom:-160px;right:-160px}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    padding:48px 36px 36px;
    border-radius:24px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 25px 60px -15px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.05) inset;
    text-align:center;
    animation:fadeUp .7s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .avatar{
    width:110px;height:110px;
    border-radius:50%;
    margin:-90px auto 20px;
    display:grid;place-items:center;
    font-size:44px;
    color:#fff;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    border:4px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 35px -10px rgba(99,102,241,0.6);
    transition:transform .3s ease;
  }
  .avatar:hover{transform:scale(1.05) rotate(-3deg)}

  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .subtitle{
    font-size:13px;
    color:rgba(255,255,255,0.6);
    margin-bottom:28px;
  }

  .info{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:28px;
  }
  .info-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;
    text-align:left;
    transition:all .25s ease;
  }
  .info-row:hover{
    background:rgba(255,255,255,0.1);
    transform:translateY(-2px);
    border-color:rgba(168,85,247,0.4);
  }
  .info-row i{
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:10px;
    background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(168,85,247,0.3));
    color:#c4b5fd;
    font-size:15px;
    flex-shrink:0;
  }
  .info-row .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:rgba(255,255,255,0.5);
    margin-bottom:2px;
  }
  .info-row .value{
    font-size:15px;
    font-weight:500;
    color:#fff;
    word-break:break-all;
  }

  .actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:130px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 18px;
    border-radius:12px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    cursor:pointer;
    transition:all .25s ease;
    border:1px solid transparent;
  }
  .btn-primary{
    background:linear-gradient(135deg,#6366f1,#a855f7);
    color:#fff;
    box-shadow:0 10px 25px -8px rgba(99,102,241,0.6);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 30px -8px rgba(168,85,247,0.7);
  }
  .btn-secondary{
    background:rgba(255,255,255,0.08);
    color:#fff;
    border-color:rgba(255,255,255,0.15);
  }
  .btn-secondary:hover{
    background:rgba(239,68,68,0.15);
    border-color:rgba(239,68,68,0.5);
    color:#fecaca;
    transform:translateY(-2px);
  }

  @media (max-width:420px){
    .card{padding:44px 22px 26px}
    .actions{flex-direction:column}
    .btn{width:100%}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"><i class="fa-solid fa-user"></i></div>
    <h1>My Profile</h1>
    <p class="subtitle">Manage your account information</p>

    <div class="info">
      <div class="info-row">
        <i class="fa-solid fa-user"></i>
        <div>
          <div class="label">Username</div>
          <div class="value">{{ user[1] }}</div>
        </div>
      </div>
      <div class="info-row">
        <i class="fa-solid fa-envelope"></i>
        <div>
          <div class="label">Email</div>
          <div class="value">{{ user[2] }}</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fa-solid fa-gauge-high"></i> Dashboard
      </a>
      <a href="{{ url_for('logout') }}" class="btn btn-secondary">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    </div>
  </div>
</body>
</html>
