<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-focus: #6366f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --error-border: #fecaca;
        }

        html, body { height: 100%; margin: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: 0;
        }
        body::before { background: #6366f1; top: -150px; left: -150px; }
        body::after  { background: #ec4899; bottom: -150px; right: -150px; }

        form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .welcome {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Preserved Jinja error block with attractive alert styling */
        form > p[style*="color:red"] {
            background: var(--error-bg) !important;
            color: var(--error-text) !important;
            padding: 12px 16px !important;
            border-radius: 10px !important;
            border: 1px solid var(--error-border) !important;
            text-align: center !important;
            margin-bottom: 20px !important;
            font-size: 14px !important;
            line-height: 1.5 !important;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
            margin-top: 16px;
        }

        br { display: none; }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.15s;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        input:hover { background: #f1f5f9; }

        input:focus {
            outline: none;
            background: #fff;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .input-group:focus-within i { color: var(--border-focus); }

        input::placeholder { color: #94a3b8; }

        button {
            margin-top: 28px;
            width: 100%;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        button:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        button:active { transform: translateY(1px); }

        .login-link {
            text-align: center;
            margin-top: 24px;
            margin-bottom: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s;
        }

        .login-link a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            form { padding: 32px 24px; border-radius: 16px; }
            h1 { font-size: 24px; }
            .welcome { font-size: 13px; }
            input { padding: 11px 12px 11px 38px; font-size: 14px; }
            .input-group i { left: 12px; font-size: 13px; }
            button { padding: 12px 18px; font-size: 14px; }
        }

        @media (max-width: 360px) {
            form { padding: 28px 20px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <form method="POST">

        <h1>Create Account</h1>

        <p class="welcome">Join us today — fill in your details below to get started.</p>

        {% if error %}
        <p style="color:red; text-align:center; margin-bottom:15px;">{{ error }}</p>
        {% endif %}

        <label>Username</label><br>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Enter your username">
        </div><br><br>

        <label>Email</label><br>
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Enter your email address">
        </div><br><br>

        <label>Password</label><br>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Create a strong password">
        </div><br><br>

        <button type="submit">Register</button>

        <p class="login-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>

    </form>

</body>
</html>
